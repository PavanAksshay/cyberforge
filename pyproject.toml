[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astraroll"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<2.1", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "redis>=5.2,<7",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

benchmark = ["psutil>=6,<8"]

[project.scripts]
astraroll-admin = "astraroll.admin:main"
astraroll-relay = "astraroll.relay:main"
astraroll-seed = "astraroll.seed:main"
astraroll-consumer = "astraroll.aggregation.consumer:main"
astraroll-replay-outbox = "astraroll.aggregation.replay:main"
astraroll-diagnostics = "astraroll.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["integration: requires migrated PostgreSQL and Redis"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
